[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tony Shangkuan @ Desktop", email = "tonyshangkuan@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "crewai>=1.15.39,<2",
    "fastmcp>=2.14.4,<3",
    "langgraph>=1.2.20",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "openai>=2.30.0,<3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-agent = "ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
