[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tony Shangkuan @ Desktop", email = "tonyshangkuan@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "crewai>=1.15.39,<2",
    "faiss-cpu>=1.16.0",
    "fastapi[standard]>=0.163.2",
    "fastmcp>=2.14.4,<3",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "openai>=2.30.0,<3",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tenacity>=9.2.1",
]

[project.scripts]
ai-agent = "ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
